# Local development only. Prod uses RDS (and S3 for photos) on AWS.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "4444:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipes"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
