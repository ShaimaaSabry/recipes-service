basePath: /v1
definitions:
  api.appleSignInRequest:
    properties:
      idToken:
        description: IDToken is the identityToken from Sign in with Apple.
        type: string
      name:
        description: Name is the full name Apple shows the app on the first sign-in
          only. Optional.
        maxLength: 200
        type: string
    required:
    - idToken
    type: object
  api.attachPhotoRequest:
    properties:
      photoKey:
        type: string
    required:
    - photoKey
    type: object
  api.catalogDTO:
    properties:
      categories:
        items:
          $ref: '#/definitions/api.categoryDTO'
        type: array
      items:
        items:
          $ref: '#/definitions/api.itemDTO'
        type: array
      units:
        items:
          $ref: '#/definitions/api.unitDTO'
        type: array
    type: object
  api.categoryDTO:
    properties:
      emoji:
        example: "\U0001F955"
        type: string
      hidden:
        type: boolean
      id:
        type: string
      name:
        example: Produce
        type: string
      source:
        enum:
        - system
        - user
        type: string
    type: object
  api.categoryRequest:
    properties:
      emoji:
        example: "\U0001F9CA"
        type: string
      name:
        example: Frozen
        type: string
    required:
    - emoji
    - name
    type: object
  api.conversionDTO:
    properties:
      factor:
        example: 10
        type: number
      fromUnitId:
        example: 01a19182-b211-7207-a87a-4bec8f271f32
        type: string
      toUnitId:
        example: 01a19182-b211-7226-8fd7-e7f5ebfa367e
        type: string
    required:
    - factor
    - fromUnitId
    - toUnitId
    type: object
  api.createItemRequest:
    properties:
      buyUnitIds:
        items:
          type: string
        minItems: 1
        type: array
      categoryId:
        type: string
      conversions:
        items:
          $ref: '#/definitions/api.conversionDTO'
        type: array
      cookUnitIds:
        items:
          type: string
        type: array
      emoji:
        example: "\U0001F9C4"
        type: string
      name:
        example: Black garlic
        type: string
    required:
    - buyUnitIds
    - categoryId
    - emoji
    - name
    type: object
  api.devSignInRequest:
    properties:
      name:
        description: Name picks the local test account; the same name signs into the
          same account.
        maxLength: 64
        type: string
    required:
    - name
    type: object
  api.editItemRequest:
    properties:
      buyUnitIds:
        items:
          type: string
        minItems: 1
        type: array
      categoryId:
        type: string
      conversions:
        description: |-
          Conversions replace the item's. Leave it out to keep the saved ones (minus any naming a unit
          the item no longer has).
        items:
          $ref: '#/definitions/api.conversionDTO'
        type: array
      cookUnitIds:
        items:
          type: string
        type: array
      emoji:
        example: "\U0001F9C4"
        type: string
      name:
        example: Black garlic
        type: string
    required:
    - buyUnitIds
    - categoryId
    - emoji
    - name
    type: object
  api.googleSignInRequest:
    properties:
      idToken:
        description: IDToken is the idToken from Google Sign-In.
        type: string
    required:
    - idToken
    type: object
  api.groceryActionDTO:
    properties:
      id:
        description: 'ID is made by the app, once per action: resending the same action
          is then harmless.'
        type: string
      itemId:
        description: ItemID names the line, for every type but clearChecked.
        type: string
      quantity:
        description: Quantity is the amount for add and setQuantity.
        example: 2
        type: number
      type:
        enum:
        - add
        - setQuantity
        - setUnit
        - check
        - uncheck
        - remove
        - clearChecked
        example: add
        type: string
      unitId:
        description: UnitID is the amount's unit for add, and the new unit for setUnit.
        type: string
    required:
    - id
    - type
    type: object
  api.groceryActionResultDTO:
    properties:
      error:
        description: Error says why a rejected action was refused.
        type: string
      id:
        type: string
      missingConversion:
        allOf:
        - $ref: '#/definitions/api.missingConversionDTO'
        description: MissingConversion is set when the action needs a conversion the
          item doesn't have yet.
      outcome:
        enum:
        - applied
        - alreadyApplied
        - rejected
        type: string
    type: object
  api.groceryActionsDTO:
    properties:
      lines:
        description: Lines is the list after the actions; it replaces the app's preview.
        items:
          $ref: '#/definitions/api.groceryLineDTO'
        type: array
      results:
        items:
          $ref: '#/definitions/api.groceryActionResultDTO'
        type: array
    type: object
  api.groceryActionsRequest:
    properties:
      actions:
        items:
          $ref: '#/definitions/api.groceryActionDTO'
        maxItems: 200
        type: array
    required:
    - actions
    type: object
  api.groceryLineDTO:
    properties:
      buyQuantity:
        example: 1
        type: number
      checked:
        type: boolean
      itemId:
        type: string
      quantity:
        description: |-
          Quantity is exact (0.04 after 2 tbsp of oil); BuyQuantity is what to show, rounded up to
          whole numbers for units sold whole (1 bottle).
        example: 0.04
        type: number
      unitId:
        type: string
    type: object
  api.groceryListDTO:
    properties:
      lines:
        items:
          $ref: '#/definitions/api.groceryLineDTO'
        type: array
    type: object
  api.hiddenRequest:
    properties:
      hidden:
        description: Hidden leaves the record out of the app's pickers; false shows
          it again.
        example: true
        type: boolean
    required:
    - hidden
    type: object
  api.importDTO:
    properties:
      imported:
        description: Imported is false when this import was done before; the result
          is the first one's.
        type: boolean
      notes:
        description: Notes say what the import had to change or leave out, to show
          the user.
        items:
          type: string
        type: array
      recipeIds:
        additionalProperties:
          type: string
        description: 'RecipeIDs maps each local recipe ID to its new ID: upload each
          recipe''s photo to it.'
        type: object
    type: object
  api.importRequest:
    properties:
      data:
        $ref: '#/definitions/api.localDataDTO'
      importId:
        description: |-
          ImportID is made by the app once and kept until the import is done, so a resend is
          recognised.
        type: string
    required:
    - data
    - importId
    type: object
  api.ingredientDTO:
    properties:
      itemId:
        type: string
      quantity:
        example: 2
        type: number
      unitId:
        type: string
    required:
    - itemId
    - quantity
    - unitId
    type: object
  api.itemDTO:
    properties:
      buyUnitIds:
        items:
          type: string
        type: array
      categoryId:
        type: string
      conversions:
        items:
          $ref: '#/definitions/api.conversionDTO'
        type: array
      cookUnitIds:
        items:
          type: string
        type: array
      emoji:
        example: "\U0001F9C4"
        type: string
      hidden:
        type: boolean
      id:
        type: string
      name:
        example: Garlic
        type: string
      source:
        enum:
        - system
        - user
        type: string
    type: object
  api.localCategoryDTO:
    properties:
      emoji:
        type: string
      hidden:
        type: boolean
      id:
        type: string
      name:
        type: string
      source:
        enum:
        - system
        - user
        type: string
    type: object
  api.localConversionDTO:
    properties:
      factor:
        type: number
      fromUnitId:
        type: string
      toUnitId:
        type: string
    type: object
  api.localDataDTO:
    properties:
      categories:
        items:
          $ref: '#/definitions/api.localCategoryDTO'
        maxItems: 1000
        type: array
      groceryList:
        items:
          $ref: '#/definitions/api.localLineDTO'
        maxItems: 5000
        type: array
      items:
        items:
          $ref: '#/definitions/api.localItemDTO'
        maxItems: 5000
        type: array
      plannedMeals:
        items:
          $ref: '#/definitions/api.localMealDTO'
        maxItems: 1000
        type: array
      recipes:
        items:
          $ref: '#/definitions/api.localRecipeDTO'
        maxItems: 5000
        type: array
      units:
        items:
          $ref: '#/definitions/api.localUnitDTO'
        maxItems: 1000
        type: array
      version:
        description: Version is the app's data version; the app migrates its data
          to 4 before sending it.
        enum:
        - 4
        example: 4
        type: integer
    required:
    - version
    type: object
  api.localIngredientDTO:
    properties:
      itemId:
        type: string
      quantity:
        type: number
      unitId:
        type: string
    type: object
  api.localItemDTO:
    properties:
      buyUnitIds:
        items:
          type: string
        type: array
      categoryId:
        type: string
      conversions:
        items:
          $ref: '#/definitions/api.localConversionDTO'
        type: array
      cookUnitIds:
        items:
          type: string
        type: array
      emoji:
        type: string
      hidden:
        type: boolean
      id:
        type: string
      name:
        type: string
      source:
        enum:
        - system
        - user
        type: string
    type: object
  api.localLineDTO:
    properties:
      checked:
        type: boolean
      itemId:
        type: string
      quantity:
        type: number
      unitId:
        type: string
    type: object
  api.localMealDTO:
    properties:
      cooked:
        type: boolean
      recipeId:
        type: string
      servings:
        type: integer
    type: object
  api.localRecipeDTO:
    properties:
      id:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/api.localIngredientDTO'
        type: array
      name:
        type: string
      servings:
        type: integer
      steps:
        items:
          type: string
        type: array
    type: object
  api.localUnitDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  api.mealDTO:
    properties:
      id:
        type: string
      plannedAt:
        type: string
      recipeId:
        type: string
      servings:
        example: 4
        type: integer
    type: object
  api.missingConversionDTO:
    properties:
      fromUnitId:
        description: Ask the user "1 fromUnit = ? toUnit", then save it with POST
          /items/{id}/conversions.
        type: string
      itemId:
        type: string
      toUnitId:
        type: string
    type: object
  api.photoUploadDTO:
    properties:
      expiresAt:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        example: PUT
        type: string
      photoKey:
        description: PhotoKey is what to attach to the recipe once the upload is done.
        type: string
      uploadUrl:
        description: Upload the image with this method, URL and headers (the body
          is the image itself).
        type: string
    type: object
  api.photoUploadRequest:
    properties:
      contentType:
        enum:
        - image/jpeg
        - image/png
        - image/heic
        - image/webp
        example: image/jpeg
        type: string
    required:
    - contentType
    type: object
  api.planMealRequest:
    properties:
      recipeId:
        type: string
      servings:
        example: 4
        maximum: 99
        minimum: 1
        type: integer
    required:
    - recipeId
    - servings
    type: object
  api.recipeDTO:
    properties:
      id:
        type: string
      ingredients:
        items:
          $ref: '#/definitions/api.ingredientDTO'
        type: array
      name:
        example: Shakshuka
        type: string
      photoUrl:
        description: PhotoURL is where the photo is served from, or null.
        type: string
      servings:
        example: 2
        type: integer
      steps:
        items:
          type: string
        type: array
    type: object
  api.recipeRequest:
    properties:
      ingredients:
        items:
          $ref: '#/definitions/api.ingredientDTO'
        type: array
      name:
        example: Shakshuka
        type: string
      servings:
        description: Servings is how many people the ingredient amounts are for.
        example: 2
        maximum: 99
        minimum: 1
        type: integer
      steps:
        example:
        - Warm the olive oil in a wide pan.
        items:
          type: string
        type: array
    required:
    - name
    - servings
    type: object
  api.refreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  api.signInResponse:
    properties:
      accessToken:
        type: string
      accessTokenExpiresAt:
        type: string
      newAccount:
        description: NewAccount is true when this sign-in created the account, e.g.
          to show onboarding.
        type: boolean
      refreshToken:
        type: string
      refreshTokenExpiresAt:
        type: string
      user:
        $ref: '#/definitions/api.userDTO'
    type: object
  api.tokensDTO:
    properties:
      accessToken:
        type: string
      accessTokenExpiresAt:
        type: string
      refreshToken:
        type: string
      refreshTokenExpiresAt:
        type: string
    type: object
  api.unitDTO:
    properties:
      baseSize:
        example: 240
        type: number
      baseUnitId:
        description: |-
          BaseUnitID and BaseSize: one of this unit is BaseSize of BaseUnitID (1 cup = 240 ml). Units
          with the same base convert into each other. Both null for units whose size depends on the
          item (pack, head…).
        type: string
      code:
        example: cup
        type: string
      id:
        type: string
      name:
        example: cup
        type: string
      soldWhole:
        description: 'SoldWhole: the grocery list rounds amounts in this unit up to
          whole numbers.'
        type: boolean
    type: object
  api.userDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Recipes, grocery items and the grocery list for the MamieNellie app.
    Sign in (locally: POST /auth/dev), then click Authorize and enter "Bearer <accessToken>".
  title: MamieNellie API
  version: "1.0"
paths:
  /auth/apple:
    post:
      description: Creates the account on the first sign-in. Send the name Apple shows
        on that first sign-in; Apple never repeats it.
      parameters:
      - description: Apple identity token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.appleSignInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.signInResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Sign in with Apple
      tags:
      - auth
  /auth/dev:
    post:
      description: Only exists when running locally, for trying the API from Swagger.
        The same name signs into the same test account.
      parameters:
      - description: Test account name
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.devSignInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.signInResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Sign in without Apple or Google (local only)
      tags:
      - auth
  /auth/google:
    post:
      description: Creates the account on the first sign-in.
      parameters:
      - description: Google ID token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.googleSignInRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.signInResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Sign in with Google
      tags:
      - auth
  /auth/refresh:
    post:
      description: Trades a refresh token for a new access token and a new refresh
        token. Each refresh token works once; keep the new one.
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.refreshTokenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokensDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Get new tokens
      tags:
      - auth
  /auth/sign-out:
    post:
      description: Ends the session the refresh token belongs to. Succeeds for an
        already-ended session too.
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.refreshTokenRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Sign out
      tags:
      - auth
  /catalog:
    get:
      description: |-
        Everything the app needs to describe groceries and convert amounts offline: the
        units, and the account's categories and items (hidden ones too) with their units
        and conversions. Send the last ETag as If-None-Match: when nothing changed, the
        answer is 304 with no body.
      parameters:
      - description: ETag of the catalog the app already has
        in: header
        name: If-None-Match
        type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Version of this catalog
              type: string
          schema:
            $ref: '#/definitions/api.catalogDTO'
        "304":
          description: Not modified
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the units, categories and grocery items
      tags:
      - catalog
  /categories:
    post:
      parameters:
      - description: The category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.categoryRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.categoryDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Another category has that name
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add a category
      tags:
      - catalog
  /categories/{id}:
    delete:
      description: |-
        Only the account's own categories, and only once no item is in them. Starter ones
        can be hidden instead.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: A starter category, or one with items in it
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - catalog
    put:
      description: Starter categories can be renamed too.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: The category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.categoryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.categoryDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Another category has that name
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rename a category
      tags:
      - catalog
  /categories/{id}/hidden:
    put:
      description: A hidden category isn't offered when picking one; its items stay
        in it.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Hide or show
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.hiddenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.categoryDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hide or show a category
      tags:
      - catalog
  /grocery-list:
    get:
      description: One line per item, in the order lines were first added.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.groceryListDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the grocery list
      tags:
      - grocery list
  /grocery-list/actions:
    post:
      description: |-
        Applies the actions in order, each on its own, and returns what happened to each
        and the list after them. Lines are named by item:
        - add {itemId, unitId, quantity}: onto the item's line, converted into its unit
        - setQuantity {itemId, quantity}: the amount, by hand, in the line's unit
        - setUnit {itemId, unitId}: another unit the item is bought in, converting the amount
        - check / uncheck / remove {itemId}, and clearChecked

        Every action has an ID the app makes once. Resending an action already applied
        changes nothing (outcome alreadyApplied), so after a dropped connection the app
        just sends its queue again. A rejected action changed nothing and can be sent again
        once fixed: missingConversion says which conversion to ask the user for. Up to 200
        actions per request.
      parameters:
      - description: The actions, in order
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.groceryActionsRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.groceryActionsDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change the grocery list
      tags:
      - grocery list
  /imports:
    post:
      description: |-
        Sent once, after the first sign-in, with the app's stored data as it is (data
        version 4). Starter categories and items are matched to the account's copies by
        their seed IDs ("item-garlic") and take on the local changes; the user's own are
        matched by name or created. Units the service doesn't have become "piece".
        Recipes are created, meals not yet cooked are planned, and grocery lines join the
        list. Anything that can't be kept as it is is changed or left out, and listed in
        notes. It all happens or none of it does. Resending the same importId returns the
        first import's result with imported false. Afterwards, upload each recipe's photo
        to its new ID from recipeIds, then delete the local data.
      parameters:
      - description: The import's ID and the app's stored data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.importRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.importDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Import the data the app kept on the phone
      tags:
      - imports
  /items:
    post:
      description: |-
        Conversions are the item's own ("1 head = 10 clove"); standard ones (1 kg = 1000 g)
        follow from the units and are refused. Each must be needed: one that already follows
        from the others is refused, so two rules can't disagree.
      parameters:
      - description: The item
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.createItemRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.itemDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Another item has that name
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add a grocery item
      tags:
      - catalog
  /items/{id}:
    delete:
      description: Only the account's own items. Starter ones can be hidden instead.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: A starter item
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a grocery item
      tags:
      - catalog
    put:
      description: |-
        Starter items can be changed too. Leave out conversions to keep the saved ones,
        minus any naming a unit the item no longer has.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: The item
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.editItemRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Another item has that name
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change a grocery item
      tags:
      - catalog
  /items/{id}/conversions:
    post:
      description: |-
        "1 fromUnit = factor toUnit" for this item, replacing the one for the same two units
        (either way round) if there is one. Used to answer "1 box = ? piece".
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: The conversion
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.conversionDTO'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add a conversion to a grocery item
      tags:
      - catalog
  /items/{id}/hidden:
    put:
      description: A hidden item isn't offered when picking one.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Hide or show
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.hiddenRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.itemDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hide or show a grocery item
      tags:
      - catalog
  /me:
    delete:
      description: Deletes the account and everything saved with it, and ends all
        its sessions. It can't be undone.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete the account
      tags:
      - account
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.userDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: The signed-in account
      tags:
      - account
  /meals:
    get:
      description: The planned meals, in the order they were planned.
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.mealDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the upcoming menu
      tags:
      - menu
  /meals/{id}:
    delete:
      description: The grocery list is left as it is. Removing a meal that's already
        gone succeeds.
      parameters:
      - description: Meal ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Not a UUID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Take a meal off the menu
      tags:
      - menu
    put:
      description: |-
        The app makes the meal's ID (a UUID), so it can plan meals offline and send them
        later. Sending the same meal again just saves it again.
      parameters:
      - description: Meal ID, made by the app
        in: path
        name: id
        required: true
        type: string
      - description: The recipe and number of people
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.planMealRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.mealDTO'
        "400":
          description: Not a UUID, or not one of the account's recipes
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Another account's meal has this ID
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Plan a meal, or change one
      tags:
      - menu
  /recipes:
    get:
      description: By name, each with its ingredients and steps.
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.recipeDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List recipes
      tags:
      - recipes
    post:
      description: |-
        Each ingredient is one of the account's grocery items, in a unit it's cooked in (or,
        for an item nobody cooks with, one it's bought in).
      parameters:
      - description: The recipe
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.recipeRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a recipe
      tags:
      - recipes
  /recipes/{id}:
    delete:
      description: Its planned meals and photo go with it. What it added to the grocery
        list stays.
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a recipe
      tags:
      - recipes
    get:
      description: Pass servings to get the ingredient amounts for that many people.
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      - description: Scale the ingredients to this many people (1 to 99)
        in: query
        name: servings
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a recipe
      tags:
      - recipes
    put:
      description: Replaces its name, servings, ingredients and steps. The photo stays.
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      - description: The recipe
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.recipeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change a recipe
      tags:
      - recipes
  /recipes/{id}/photo:
    delete:
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove a recipe's photo
      tags:
      - recipes
    put:
      description: The previous photo is deleted.
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      - description: The photoKey from the upload link
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.attachPhotoRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "400":
          description: Not uploaded, too large, or not an image
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Photos aren't set up where the service runs
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Set a recipe's photo to one just uploaded
      tags:
      - recipes
  /recipes/{id}/photo/upload:
    post:
      description: |-
        Upload the image itself with the returned method, URL and headers, within 15
        minutes, then attach it with PUT /recipes/{id}/photo. Photos up to 10 MB.
      parameters:
      - description: Recipe ID
        in: path
        name: id
        required: true
        type: string
      - description: The photo's type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.photoUploadRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.photoUploadDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Photos aren't set up where the service runs
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a link to upload a recipe photo to
      tags:
      - recipes
securityDefinitions:
  BearerAuth:
    description: '"Bearer " followed by the accessToken from signing in.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
