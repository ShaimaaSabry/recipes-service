basePath: /v1
definitions:
  api.createRecipeRequest:
    properties:
      id:
        description: ID is optional; the app sends the one it created, possibly while
          offline.
        maxLength: 64
        type: string
      name:
        type: string
    required:
    - name
    type: object
  api.recipeDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: Recipes, grocery items and the grocery list for the MamieNellie app.
  title: MamieNellie API
  version: "1.0"
paths:
  /recipes:
    get:
      parameters:
      - description: Owner of the data
        in: header
        name: X-Device-Id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.recipeDTO'
            type: array
      summary: List recipes
      tags:
      - recipes
    post:
      parameters:
      - description: Owner of the data
        in: header
        name: X-Device-Id
        required: true
        type: string
      - description: Create recipe payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api.createRecipeRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.recipeDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Create a recipe
      tags:
      - recipes
swagger: "2.0"
