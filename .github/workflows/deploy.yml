name: Deploy to Prod

# Manual only: run it from Actions → "Deploy to Prod" → Run workflow. The prod
# GitHub environment can require your approval before the deploy job starts.
on:
  workflow_dispatch:

# Never cancel a deploy halfway; a second run waits for the first.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Names follow the Terraform convention <project>-<environment>.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_NAME: mamie-nellie
  ECS_CLUSTER: mamie-nellie-prod
  ECS_SERVICE: mamie-nellie-prod-service
  TASK_FAMILY: mamie-nellie-prod

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml

  # -------------------------------------------------------------------------
  # Build the image and push it to ECR, tagged with the git SHA
  # -------------------------------------------------------------------------
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: checks

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ github.sha }}
      # Deploys pin the image by digest: tags can move, the digest can't.
      image_digest: ${{ steps.push.outputs.digest }}
      image_repository: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          cache-to: type=inline

      # Reports CRITICAL/HIGH findings, but only fails on CRITICAL ones that have a fix.
      - name: Vulnerability report (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          vuln-type: os,library

      - name: Vulnerability gate (fails on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          vuln-type: os,library

  # -------------------------------------------------------------------------
  # Point the ECS service at the new image and wait until it's healthy
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register a task definition with the new image
        id: register
        env:
          IMAGE: ${{ needs.build.outputs.image_repository }}@${{ needs.build.outputs.image_digest }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-def.json
          jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def.json > task-def-updated.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN with $IMAGE"

      - name: Update the service
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" > /dev/null

      # Watches this deployment, not just "a task is running": with the circuit
      # breaker on, ECS rolls a failed deploy back to the old task definition,
      # which would otherwise look like success.
      - name: Wait for the deployment to finish
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.arn }}
        run: |
          for i in $(seq 1 60); do
            DEPLOYMENT=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?taskDefinition=='$TASK_DEF_ARN'] | [0]" --output json)
            STATUS=$(echo "$DEPLOYMENT" | jq -r '.status // "GONE"')
            ROLLOUT=$(echo "$DEPLOYMENT" | jq -r '.rolloutState // "UNKNOWN"')
            echo "Attempt $i: status=$STATUS rollout=$ROLLOUT running=$(echo "$DEPLOYMENT" | jq -r '.runningCount // 0')"
            if [ "$STATUS" = "PRIMARY" ] && [ "$ROLLOUT" = "COMPLETED" ]; then
              echo "Deployment finished."
              exit 0
            fi
            if [ "$ROLLOUT" = "FAILED" ] || [ "$STATUS" = "GONE" ]; then
              echo "Deployment failed or was rolled back: $(echo "$DEPLOYMENT" | jq -r '.rolloutStateReason // "no reason given"')"
              TASK=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --family "$TASK_FAMILY" --desired-status STOPPED \
                --query 'taskArns[0]' --output text)
              [ "$TASK" != "None" ] && aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].{stopCode:stopCode,reason:stoppedReason,container:containers[0].reason}' --output json
              exit 1
            fi
            sleep 10
          done
          echo "The deployment did not finish within 10 minutes."
          exit 1

      - name: Check the load balancer sees a healthy task
        run: |
          TARGET_GROUP=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].loadBalancers[0].targetGroupArn' --output text)
          for i in $(seq 1 24); do
            # shellcheck disable=SC2016 # the backticks are a JMESPath literal, not shell
            HEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)
            echo "Attempt $i: healthy targets = $HEALTHY"
            [ "$HEALTHY" -ge 1 ] && exit 0
            sleep 10
          done
          echo "No healthy target after 4 minutes."
          exit 1

      # prod-<sha> marks images that ran in prod; the ECR lifecycle policy keeps
      # them as rollback targets. Re-tagging reuses the manifest: same digest.
      - name: Mark the image as deployed to prod
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          PROD_TAG: prod-${{ needs.build.outputs.image_tag }}
        run: |
          IMAGE=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids imageDigest="$IMAGE_DIGEST" \
            --accepted-media-types \
              application/vnd.oci.image.index.v1+json \
              application/vnd.docker.distribution.manifest.list.v2+json \
              application/vnd.oci.image.manifest.v1+json \
              application/vnd.docker.distribution.manifest.v2+json \
            --query 'images[0]' --output json)
          if ! OUTPUT=$(aws ecr put-image --repository-name "$ECR_REPOSITORY_NAME" --image-tag "$PROD_TAG" \
            --image-manifest "$(echo "$IMAGE" | jq -r '.imageManifest')" \
            --image-manifest-media-type "$(echo "$IMAGE" | jq -r '.imageManifestMediaType')" 2>&1); then
            if echo "$OUTPUT" | grep -q ImageAlreadyExistsException; then
              echo "$PROD_TAG already points at this image."
            else
              echo "$OUTPUT"
              exit 1
            fi
          fi
          echo "Tagged $IMAGE_DIGEST as $PROD_TAG."
